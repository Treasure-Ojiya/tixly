<div class="p-6">
  <h2 class="text-xl font-bold text-ink mb-4">Edit Profile</h2>

  <form [formGroup]="profileForm" (ngSubmit)="saveProfile()" class="space-y-4">
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-semibold text-ink mb-1"
          >First Name</label
        >
        <input
          formControlName="first_name"
          type="text"
          class="w-full rounded-xl border border-gray-300 px-4 py-2 text-sm focus:outline-2 focus:outline-brand"
        />
      </div>
      <div>
        <label class="block text-sm font-semibold text-ink mb-1"
          >Last Name</label
        >
        <input
          formControlName="last_name"
          type="text"
          class="w-full rounded-xl border border-gray-300 px-4 py-2 text-sm focus:outline-2 focus:outline-brand"
        />
      </div>
    </div>

    <div>
      <label class="block text-sm font-semibold text-ink mb-1">Phone</label>
      <input
        formControlName="phone"
        type="tel"
        class="w-full rounded-xl border border-gray-300 px-4 py-2 text-sm focus:outline-2 focus:outline-brand"
      />
    </div>

    <div class="pt-4 border-t border-gray-100">
      <h3 class="text-sm font-bold text-ink mb-3">
        Change Password (Optional)
      </h3>
      <div class="space-y-3">
        <input
          formControlName="current_password"
          type="password"
          placeholder="Current Password"
          class="w-full rounded-xl border border-gray-300 px-4 py-2 text-sm focus:outline-2 focus:outline-brand"
        />
        <input
          formControlName="new_password"
          type="password"
          placeholder="New Password"
          class="w-full rounded-xl border border-gray-300 px-4 py-2 text-sm focus:outline-2 focus:outline-brand"
        />
      </div>
    </div>

    <div class="flex justify-end gap-3 mt-6">
      <button
        type="button"
        (click)="dialogRef.close()"
        class="px-5 py-2 rounded-full text-sm font-semibold text-gray-500 hover:bg-gray-100 transition-colors cursor-pointer"
      >
        Cancel
      </button>
      <button
        type="submit"
        [disabled]="profileForm.invalid || isSaving"
        class="px-5 py-2 rounded-full bg-brand text-white text-sm font-semibold hover:bg-brand-dar cursor-pointer disabled:opacity-50 transition-colors"
      >
        {{ isSaving ? "Saving..." : "Save Changes" }}
      </button>
    </div>
  </form>
</div>
