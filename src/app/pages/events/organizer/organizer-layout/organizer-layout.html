<div
  class="fixed inset-0 flex flex-col overflow-hidden bg-surface"
  (keydown.escape)="closeMobileMenu()"
>
  <header
    class="z-30 flex shrink-0 items-center justify-between bg-nav px-4 py-2 font-semibold text-white shadow-sm sm:px-6"
  >
    <div class="flex items-center gap-3">
      <button
        type="button"
        (click)="toggleMobileMenu()"
        aria-label="Toggle navigation menu"
        aria-controls="dashboard-sidebar"
        [attr.aria-expanded]="mobileMenuOpen"
        class="rounded-lg p-2 transition-colors hover:bg-white/10 cursor-pointer md:hidden"
      >
        <i class="fas fa-bars text-lg" aria-hidden="true"></i>
      </button>

      <a routerLink="/home" aria-label="Tixly home" class="block rounded-md">
        <img
          src="assets/logo/evvnt-logo-white-1.svg"
          alt="Tixly"
          class="block h-auto w-20"
        />
      </a>
    </div>

    <div
      class="flex items-center gap-2 rounded-full bg-white/10 py-1 pl-1.5 pr-4"
    >
      <span
        class="flex h-7 w-7 items-center justify-center rounded-full bg-white/15"
      >
        <img src="assets/icons/user.svg" alt="" class="h-4 w-4" />
      </span>

      <span class="max-w-40 truncate text-sm font-medium">
        <span class="hidden sm:inline">Welcome,</span> {{ user }}
      </span>
    </div>
  </header>

  <div class="flex min-h-0 flex-1 overflow-hidden">
    <!-- Mobile backdrop -->
    @if (mobileMenuOpen) {
      <div
        class="fixed inset-0 z-40 bg-black/40 md:hidden"
        (click)="closeMobileMenu()"
        aria-hidden="true"
      ></div>
    }

    <aside
      id="dashboard-sidebar"
      class="fixed inset-y-0 left-0 z-50 flex w-60 shrink-0 flex-col gap-4 overflow-y-auto bg-nav px-3 py-6 shadow-lg transition-[transform,width] duration-300 md:static md:z-auto md:translate-x-0 md:shadow-none"
      [ngClass]="{
        'translate-x-0': mobileMenuOpen,
        '-translate-x-full': !mobileMenuOpen,
        'md:w-52 md:px-4': !isCollapsed,
        'md:w-20': isCollapsed,
      }"
    >
      <nav class="flex w-full flex-col gap-1.5 text-white" aria-label="Main">
        @for (item of navItems; track item.link) {
          <a
            [routerLink]="item.link"
            routerLinkActive="bg-white/15 before:opacity-100"
            ariaCurrentWhenActive="page"
            [attr.title]="isCollapsed ? item.label : null"
            (click)="closeMobileMenu()"
            class="relative flex w-full items-center gap-3 rounded-xl p-3 transition-colors hover:bg-white/20 before:absolute before:left-0 before:top-1/2 before:h-5 before:w-1 before:-translate-y-1/2 before:rounded-r-full before:bg-white before:opacity-0 before:transition-opacity"
            [ngClass]="{ 'md:justify-center md:gap-0': isCollapsed }"
          >
            <img
              [src]="item.icon"
              alt=""
              width="20"
              height="20"
              class="shrink-0"
            />

            <span
              class="font-medium"
              [ngClass]="{ 'md:sr-only': isCollapsed }"
              >{{ item.label }}</span
            >
          </a>
        }
      </nav>

      <div class="mt-auto border-t border-white/10 pt-4">
        <button
          type="button"
          (click)="logout()"
          [attr.title]="isCollapsed ? 'Logout' : null"
          class="flex w-full items-center gap-3 rounded-xl p-3 text-white transition-colors hover:bg-white/20 cursor-pointer"
          [ngClass]="{ 'md:justify-center md:gap-0': isCollapsed }"
        >
          <img
            src="assets/icons/logout-white.svg"
            alt=""
            width="20"
            height="20"
            class="shrink-0"
          />

          <span class="font-medium" [ngClass]="{ 'md:sr-only': isCollapsed }"
            >Logout</span
          >
        </button>
      </div>
    </aside>

    <main
      id="main-content"
      class="min-h-0 min-w-0 flex-1 overflow-y-auto overflow-x-hidden bg-surface"
    >
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
